<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アーカイブサイト</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: 誠実で落ち着いた印象の明朝体とゴシック体 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500&family=Shippori+Mincho:wght@500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans JP"', 'sans-serif'],
            serif: ['"Shippori Mincho"', 'serif'],
          },
          colors: {
            paper: '#f7f6f2',
            ink: '#262523',
            muted: '#6e6c67',
            borderline: '#e3e0d8',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-paper text-ink font-sans antialiased selection:bg-stone-300 selection:text-ink min-h-screen flex flex-col">

  <!-- ヘッダー -->
  <header class="w-full max-w-6xl mx-auto px-6 sm:px-10 pt-14 pb-10 border-b border-borderline">
    <div class="flex flex-col md:flex-row md:items-end justify-between gap-6">
      <div>
        <p class="text-xs tracking-[0.2em] text-muted uppercase mb-2">Personal Visual Collection</p>
        <h1 class="font-serif text-3xl sm:text-4xl font-semibold tracking-wider text-ink">
          アーカイブサイト
        </h1>
      </div>
      
      <!-- 言葉（問い）の欄：条件通り「(ここに言葉)」とだけ記載 -->
      <div class="md:max-w-md border-l-2 border-stone-400 pl-4 py-1">
        <p class="font-serif text-base sm:text-lg text-ink leading-relaxed">
          (ここに言葉)
        </p>
      </div>
    </div>
  </header>

  <!-- メインコンテンツ：写真を大きく見せるグリッド -->
  <main class="flex-grow w-full max-w-6xl mx-auto px-6 sm:px-10 py-12 sm:py-16">
    <div id="archive-grid" class="grid grid-cols-1 md:grid-cols-2 gap-10 sm:gap-14">
      <!-- JavaScriptによってここにアイテムが挿入されます -->
    </div>
  </main>

  <!-- フッター -->
  <footer class="w-full max-w-6xl mx-auto px-6 sm:px-10 py-8 border-t border-borderline text-xs text-muted flex flex-col sm:flex-row justify-between items-center gap-4">
    <p>アーカイブサイト</p>
    <p id="item-count">全 5 件の資料</p>
  </footer>

  <!-- 拡大表示用モーダル（ライトボックス） -->
  <div id="lightbox-modal" class="fixed inset-0 z-50 hidden bg-stone-900/90 backdrop-blur-sm flex items-center justify-center p-4 sm:p-8 opacity-0 transition-opacity duration-300" role="dialog" aria-modal="true">
    <div class="relative max-w-5xl w-full flex flex-col items-center">
      <!-- 閉じるボタン -->
      <button id="close-modal-btn" type="button" class="self-end mb-3 px-4 py-2 text-sm text-stone-200 hover:text-white bg-stone-800/80 hover:bg-stone-700 rounded-lg transition-colors flex items-center gap-2 cursor-pointer">
        <span>閉じる</span>
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>

      <!-- 拡大画像コンテナ -->
      <div class="bg-white p-2 sm:p-3 rounded-lg shadow-2xl max-h-[80vh] flex items-center justify-center overflow-hidden">
        <img id="modal-image" src="" alt="" class="max-h-[75vh] w-auto object-contain rounded">
      </div>

      <!-- 名前 -->
      <div class="mt-4 text-center">
        <p id="modal-title" class="font-serif text-lg sm:text-xl text-stone-100 tracking-wide"></p>
      </div>
    </div>
  </div>

  <!-- アプリケーションロジック -->
  <script>
    /**
     * アーカイブ資料データ
     * すべて「images/ファイル名.jpg」で統一しています。
     */
    const archiveItems = [
      {
        id: '01',
        src: 'images/01.jpg',
        name: '満月と噴水の夜'
      },
      {
        id: '02',
        src: 'images/02.jpg',
        name: '白い鳥の紋章'
      },
      {
        id: '03',
        src: 'images/03.jpg',
        name: '夕暮れの水平線'
      },
      {
        id: '04',
        src: 'images/04.jpg',
        name: 'モザイクのひまわり'
      },
      {
        id: '05',
        src: 'images/05.jpg',
        name: 'ステージの四人と虹'
      }
    ];

    /**
     * グリッドに資料カードをレンダリングする関数
     */
    function renderArchiveGrid() {
      const gridContainer = document.getElementById('archive-grid');
      const countElement = document.getElementById('item-count');
      
      if (!gridContainer) return;

      gridContainer.innerHTML = '';
      countElement.textContent = `全 ${archiveItems.length} 件の資料`;

      archiveItems.forEach((item) => {
        // 1件ごとのカード要素
        const article = document.createElement('article');
        article.className = 'group flex flex-col cursor-pointer';
        article.setAttribute('tabindex', '0');
        article.setAttribute('role', 'button');
        article.setAttribute('aria-label', `${item.name}を拡大表示`);

        // 写真を大きく誠実に収めるフレーム
        const imageWrapper = document.createElement('div');
        imageWrapper.className = 'w-full aspect-[4/3] bg-white border border-borderline rounded-lg p-4 sm:p-6 flex items-center justify-center overflow-hidden shadow-sm group-hover:shadow-md group-hover:border-stone-400 transition-all duration-300';

        const img = document.createElement('img');
        img.src = item.src;
        img.alt = item.name;
        img.loading = 'lazy';
        img.className = 'max-w-full max-h-full w-auto h-auto object-contain rounded transition-transform duration-500 ease-out group-hover:scale-[1.02]';

        // 画像が見つからない場合のフォールバック表示
        img.onerror = function() {
          this.onerror = null;
          this.src = `https://placehold.co/800x600/e3e0d8/6e6c67?text=${encodeURIComponent(item.src)}`;
        };

        imageWrapper.appendChild(img);

        // キャプション（名前のみ）
        const caption = document.createElement('div');
        caption.className = 'mt-4 flex items-baseline justify-between border-b border-transparent group-hover:border-borderline pb-2 transition-colors';

        const title = document.createElement('h2');
        title.className = 'font-serif text-lg sm:text-xl font-medium text-ink tracking-wide';
        title.textContent = item.name;

        const indexLabel = document.createElement('span');
        indexLabel.className = 'text-xs font-mono text-muted';
        indexLabel.textContent = `No.${item.id}`;

        caption.appendChild(title);
        caption.appendChild(indexLabel);

        article.appendChild(imageWrapper);
        article.appendChild(caption);

        // クリックおよびEnterキーで拡大表示
        article.addEventListener('click', () => openLightbox(item));
        article.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            openLightbox(item);
          }
        });

        gridContainer.appendChild(article);
      });
    }

    /**
     * 拡大表示モーダルを開く関数
     */
    function openLightbox(item) {
      const modal = document.getElementById('lightbox-modal');
      const modalImg = document.getElementById('modal-image');
      const modalTitle = document.getElementById('modal-title');

      modalImg.src = item.src;
      modalImg.alt = item.name;
      modalImg.onerror = function() {
        this.onerror = null;
        this.src = `https://placehold.co/800x600/e3e0d8/6e6c67?text=${encodeURIComponent(item.src)}`;
      };
      modalTitle.textContent = item.name;

      modal.classList.remove('hidden');
      requestAnimationFrame(() => {
        modal.classList.remove('opacity-0');
        modal.classList.add('opacity-100');
      });
      document.body.style.overflow = 'hidden';
    }

    /**
     * 拡大表示モーダルを閉じる関数
     */
    function closeLightbox() {
      const modal = document.getElementById('lightbox-modal');
      modal.classList.remove('opacity-100');
      modal.classList.add('opacity-0');
      
      setTimeout(() => {
        modal.classList.add('hidden');
        document.body.style.overflow = '';
      }, 300);
    }

    // 初期化処理
    document.addEventListener('DOMContentLoaded', () => {
      renderArchiveGrid();

      const modal = document.getElementById('lightbox-modal');
      const closeBtn = document.getElementById('close-modal-btn');

      closeBtn.addEventListener('click', closeLightbox);

      // 背景クリックで閉じる
      modal.addEventListener('click', (e) => {
        if (e.target === modal) {
          closeLightbox();
        }
      });

      // Escキーで閉じる
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && !modal.classList.contains('hidden')) {
          closeLightbox();
        }
      });
    });
  </script>
</body>
</html>
